# Render Blueprint — École Abou el Anouar
# 1) Le service web est construit depuis le Dockerfile
# 2) Une base PostgreSQL gratuite est provisionnée et son URL est
#    automatiquement injectée dans DATABASE_URL

databases:
  - name: ecole-db
    plan: free
    databaseName: ecole_abou_anouar
    user: ecole

services:
  - type: web
    name: ecole-abou-el-anouar
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecole-db
          property: connectionString